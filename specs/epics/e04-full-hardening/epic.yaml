id: e04
slug: full-hardening
title: "Secure, persistent and operable production"
status: active
design: "docs/superpowers/specs/2026-08-16-full-hardening-design.md"
impact: "specs/IMPACT_LATEST.md"
decisions:
  - "Keep one TanStack Start/Nitro runtime, one Docker service and the existing cron."
  - "Production never falls back to preview OAuth, PGLite or literal credentials."
  - "Private domains are owner-scoped; the profile catalog is cron/admin managed."
  - "Use expand-verify-contract for schemas and Supabase credential migration."
  - "Prefer native accessibility and delete unsupported offline copy instead of adding a cache platform."
  - "Do not mass-convert unrelated .mjs/.d.mts pairs."
