services:
  news:
    image: "news-news:${NEWS_IMAGE_TAG:-latest}"
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGORA_RUNTIME_MODE: production
      NODE_ENV: production
      PORT: "3080"
      NITRO_PORT: "3080"
      NITRO_HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3080:3080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3080/api/health/live').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
